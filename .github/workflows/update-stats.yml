name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Stats
        uses: actions/github-script@v7
        with:
          script: |
            const username = 'imrickmondal';

            const prs = await github.paginate(
              github.rest.search.issuesAndPullRequests,
              {
                q: `author:${username} is:pr`
              }
            );

            const issues = await github.paginate(
              github.rest.search.issuesAndPullRequests,
              {
                q: `author:${username} is:issue`
              }
            );

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username
              }
            );

            let stars = 0;

            repos.forEach(repo => {
              stars += repo.stargazers_count;
            });

            const fs = require('fs');
            let readme = fs.readFileSync('README.md', 'utf8');

            readme = readme.replace(
              /<!-- PR_COUNT -->.*<!-- \/PR_COUNT -->/,
              `<!-- PR_COUNT -->${prs.length}<!-- /PR_COUNT -->`
            );

            readme = readme.replace(
              /<!-- ISSUE_COUNT -->.*<!-- \/ISSUE_COUNT -->/,
              `<!-- ISSUE_COUNT -->${issues.length}<!-- /ISSUE_COUNT -->`
            );

            readme = readme.replace(
              /<!-- STAR_COUNT -->.*<!-- \/STAR_COUNT -->/,
              `<!-- STAR_COUNT -->${stars}<!-- /STAR_COUNT -->`
            );

            fs.writeFileSync('README.md', readme);

      - name: Commit Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add README.md

          git diff --cached --quiet || git commit -m "Update GitHub stats"

          git push
