name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update README Stats
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const username = 'Spectrae';

            console.log(`Fetching stats for ${username}`);

            const mergedPrResult =
              await github.rest.search.issuesAndPullRequests({
                q: `author:${username} is:pr is:merged`
              });

            const resolvedIssueResult =
              await github.rest.search.issuesAndPullRequests({
                q: `assignee:${username} is:issue is:closed`
              });

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username,
                per_page: 100
              }
            );

            let stars = 0;

            repos.forEach(repo => {
              stars += repo.stargazers_count;
            });

            const mergedPrCount = mergedPrResult.data.total_count;
            const resolvedIssueCount = resolvedIssueResult.data.total_count;

            console.log(`Merged PRs: ${mergedPrCount}`);
            console.log(`Resolved Issues: ${resolvedIssueCount}`);
            console.log(`Stars: ${stars}`);

            let readme = fs.readFileSync('README.md', 'utf8');

            readme = readme.replace(
              /<!-- MERGED_PR_COUNT -->.*<!-- \/MERGED_PR_COUNT -->/,
              `<!-- MERGED_PR_COUNT -->${mergedPrCount}<!-- /MERGED_PR_COUNT -->`
            );

            readme = readme.replace(
              /<!-- RESOLVED_ISSUE_COUNT -->.*<!-- \/RESOLVED_ISSUE_COUNT -->/,
              `<!-- RESOLVED_ISSUE_COUNT -->${resolvedIssueCount}<!-- /RESOLVED_ISSUE_COUNT -->`
            );

            readme = readme.replace(
              /<!-- STAR_COUNT -->.*<!-- \/STAR_COUNT -->/,
              `<!-- STAR_COUNT -->${stars}<!-- /STAR_COUNT -->`
            );

            fs.writeFileSync('README.md', readme);

            console.log('README updated successfully');

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Update GitHub stats"
            git push
          fi
